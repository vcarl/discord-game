ui.helpButton: Help
ui.helpTitle: Help
ui.helpContent: "Make one choice each week. Climb from **newcomer** to **mod** to **admin**, then grow the server to **100,000 members**. Keep your **vibes** above 0. Burnout makes everything harder, and hot takes feel great until the fallout. As admin, every mod gives you +1 vibe a week, but they need looking after. All outcomes are decided by the RNG. **Sometimes the RNG is a troll.**"
ui.privacyNoticeButton: About
ui.privacyNoticeTitle: About
ui.privacyNoticeContent: "A Discord-themed mod of **PhD Simulator** by Mianzhi Wang (MIT license). Same engine, new ruleset. Not affiliated with Discord. Original: github.com/morriswmz/phd-game. Visits are counted anonymously with GoatCounter (no cookies)."
