item.inJoke: In-Joke
item.inJoke.description: "You finally get one of the server's in-jokes. Your next post or emoji entry uses it and is **more likely to land**. While you have one, your posts and answers are **more likely to get pinned**."
item.goodPost: Good Post
item.goodPost.description: A post that got some reactions. Polish it into a banger and it might get pinned.
item.pinnedMessage: Pinned Message
item.pinnedMessage.description: Immortalized in the pins. The mods have noticed you.
item.vanityRole: Vanity Role
item.vanityRole.description: A colorful role with a silly name next to yours. Purely cosmetic. Absolutely essential.
item.customEmoji: Personalized Emoji
item.customEmoji.description: "An emoji of your own in the server. People react with it. **+5% proposal approval** while you have one."
item.regular: Regular
item.regular.description: "A dependable community member. You can ask them to mod, but most would rather just hang out (**1 in 4** say yes)."
item.mod: Mod
item.mod.description: "A volunteer moderator. **+1 vibe** every week, keeps raids under control, and helps the server grow. Morale drops every week; adopted proposals and doing mod work yourself raise it."
item.idea: Idea
item.idea.description: Feedback from the community. Can be drafted into a proposal.
item.draftProposal: Draft Proposal
item.draftProposal.description: A proposed change to the server, ready to announce.
item.announcedProposal: Announced Proposal
item.announcedProposal.description: Posted in #announcements. The community is deciding how it feels.
item.revisedProposal: Revised Proposal
item.revisedProposal.description: A second attempt after the backlash. Better odds this time.
item.backlash: Backlash
item.backlash.description: "A proposal the community hated. **-1% members every week** until you revise it."
item.adoptedChange: Adopted Change
item.adoptedChange.description: "A change the community loves. **Permanently boosts weekly growth.**"

status.newcomer: Newcomer Glow
status.newcomer.description: "**+1 vibe** every week. Everything is new and exciting."
status.emojiContest: Emoji Contest
status.emojiContest.description: You can submit an emoji. Having an in-joke to draw from improves your chances.
status.serverBoosted: Server Boosted
status.serverBoosted.description: Someone boosted the server. Growth is up for a while.
status.burnout: Burnout
status.burnout.description: "**-5 vibes** every week, and everything you try is less likely to work. Go touch grass."
status.modTitle: Mod
status.modTitle.description: "**-2 vibes** every week. Moderation is work. Unlocks the report queue."
status.adminRole: Admin
status.adminRole.description: "**-5 vibes** every week. Everything is your problem now. Mods help (+1 each)."
status.raid: Raid
status.raid.description: "**-2 vibes** and **-3% members** every week until the raiders are banned or get bored (up to 4 weeks)."
status.drama: Drama
status.drama.description: "You started something. Fallout may land any week while this lasts."

# Opening
message.beginning: "A friend DMs you an invite to a small Discord server for a niche hobby you're into. It has about **{{server.members}} members**."
message.acceptInvite: Click the invite.
message.ignoreInvite: Leave it on read.
message.joinedServer: "You joined! A bot posts a welcome message nobody reads. Make yourself known, earn **vanity roles** and **personalized emoji**, get modded, and maybe one day become admin. Keep your **vibes** up."
message.ignoredInvite: "You never joined. You spent those years doing other things. Possibly better things. **You win?**"
